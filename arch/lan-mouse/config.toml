# lan-mouse config — ARCH side.
# The peer configured here is the WINDOWS machine. Fill in its reachable IP and
# its cert fingerprint (both are printed by lan-mouse on the Windows box on first
# run — see the repo README, "Certificates & fingerprints are per-machine").

port = 4242

# Clipboard sharing over DTLS (sync-at-crossing). Requires the patched fork on
# both ends; keep it true on both machines, or remove it from both — never one-sided.
enable_clipboard = true

release_bind = [
    # Ctrl + Shift + Alt + Space, held together, on the machine that currently
    # HAS the mouse. Emergency escape hatch: it is checked on the capture side
    # before events are forwarded, so it still fires when the pointer is stuck
    # on the peer. Deliberately NOT Meta/Super — the Win key opens the Start
    # menu on Windows and is Hyprland's primary modifier on Arch, so a chord
    # containing it has side effects on whichever box you are trying to escape.
    "KeyLeftCtrl",
    "KeyLeftShift",
    "KeyLeftAlt",
    "KeySpace",
]

[[clients]]
hostname = "win-pc"                        # your Windows peer's hostname
ips = ["100.x.x.x"]                        # <-- your Windows peer's Tailscale (or LAN) IP
position = "left"
activate_on_startup = true

[authorized_fingerprints]
# <-- your Windows peer's cert fingerprint (SHA-256 of its cert DER, logged on startup)
"aa:bb:cc:dd:ee:ff:00:11:22:33:44:55:66:77:88:99:aa:bb:cc:dd:ee:ff:00:11:22:33:44:55:66:77:88:99" = "win-pc"
