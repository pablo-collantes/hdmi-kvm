# ── lan-mouse daemon autostart ───────────────────────────────────────────
# Add to ~/.config/hypr/autostart.conf (or wherever your exec-once lines live).
# Launches the patched lan-mouse with the layer-shell capture backend, daemon mode.
# (install.sh builds + installs the binary to ~/.local/bin/lan-mouse.)

exec-once = $HOME/.local/bin/lan-mouse --capture-backend layer-shell daemon
