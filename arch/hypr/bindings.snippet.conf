# ── HDMI software switcher — Arch keybind ────────────────────────────────
# Add this line to your Hyprland keybinds (e.g. ~/.config/hypr/bindings.conf).
#
# SUPER+ALT+H switches the shared Acer XF243Y to HDMI-1 (the Windows PC).
# Design: "each side switches the monitor away from itself" — the Windows side
# binds the same physical chord (Win+Alt+H) to switch it back to DisplayPort.
# That way the DDC write always travels over the currently-active video link.

# Switch Acer XF243Y to HDMI-1 (Windows machine)
bindd = SUPER ALT, H, Switch monitor to Windows (HDMI), exec, ~/.config/hypr/scripts/switch-to-windows.sh
