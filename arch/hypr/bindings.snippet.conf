# ── HDMI software switcher — Arch keybind ────────────────────────────────
# Add this line to your Hyprland keybinds (e.g. ~/.config/hypr/bindings.conf).
#
# SUPER+ALT+H switches the shared Acer XF243Y to HDMI-1 (the Windows PC).
# Design: "each side switches the monitor away from itself" — the Windows side
# binds the same physical chord (Win+Alt+H) to switch it back to DisplayPort.
# That way the DDC write always travels over the currently-active video link.

# Switch Acer XF243Y to HDMI-1 (Windows machine)
bindd = SUPER ALT, H, Switch monitor to Windows (HDMI), exec, ~/.config/hypr/scripts/switch-to-windows.sh

# ── lan-mouse KVM: lock the pointer to the current screen / restart ──────
# SUPER+ALT+P toggles "hold": while locked the mouse/keyboard can't cross to the
# other PC AND can't be dragged back — you stay on whichever screen you're using
# (lock onto Windows while working there, or onto Arch). Press again to unlock.
# SUPER+ALT+\ unlocks + re-arms the link if it ever gets stuck. The Windows side
# binds the same physical chords (Win+Alt+P / Win+Alt+\), which reach this same
# Arch daemon over SSH — see windows/Tools/switch-hotkey.ahk.
bindd = SUPER ALT, P, lan-mouse: lock/unlock this screen, exec, ~/.config/hypr/scripts/lanmouse-kvm.sh toggle
bindd = SUPER ALT, backslash, lan-mouse: restart link, exec, ~/.config/hypr/scripts/lanmouse-kvm.sh restart
